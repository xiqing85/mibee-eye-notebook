[package]
name = "streaming"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Enable AAC audio encoding (required for RTMP audio + standards-compliant MP4
# audio). Off by default — G.711 μ-law is the default audio codec, which works
# for RTSP but is non-compliant for RTMP/MP4.
default = []
aac = ["dep:fdk-aac"]

[dependencies]
capture = { path = "../capture" }
tokio.workspace = true
tracing.workspace = true
anyhow.workspace = true
opentelemetry.workspace = true
uuid.workspace = true
protocols = { path = "../protocols" }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde.workspace = true
serde_json.workspace = true
futures = "0.3"
cpal.workspace = true
parking_lot = "0.12"
observability = { path = "../observability" }
# Native codec stack (ffmpeg replacement)
openh264.workspace = true
jpeg-decoder.workspace = true
jpeg-encoder.workspace = true
muxide.workspace = true
fdk-aac = { workspace = true, optional = true }

[dev-dependencies]
axum.workspace = true
http = "1"
bytes = "1"
