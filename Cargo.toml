[workspace]
resolver = "2"
members = [
    "crates/capture",
    "crates/protocols",
    "crates/streaming",
    "crates/web",
    "crates/security",
    "crates/observability",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
description = "Professional laptop surveillance agent"
license = "NON-COMMERCIAL"
rust-version = "1.85"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
anyhow = "1"
include_dir = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.33"
opentelemetry = "0.32"
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic"] }
opentelemetry-prometheus = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
prometheus = "0.14"
rusqlite = { version = "0.32", features = ["bundled"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
rustls = "0.23"
rustls-pemfile = "2"
bcrypt = "0.17"
rand = "0.8"
nokhwa = { version = "0.10", features = ["input-native"] }
cpal = "0.18"
rcgen = "0.14"
axum-server = { version = "0.7", features = ["tls-rustls"] }

[package]
name = "mibee-rec"
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
description = "Professional laptop surveillance agent"
rust-version = "1.85"

[dependencies]
tokio.workspace = true
clap.workspace = true
toml.workspace = true
anyhow.workspace = true
serde.workspace = true
tracing.workspace = true
thiserror.workspace = true
uuid.workspace = true
serde_json.workspace = true
protocols = { path = "crates/protocols" }
observability = { path = "crates/observability" }
web = { path = "crates/web" }
security = { path = "crates/security" }
