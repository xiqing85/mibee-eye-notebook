[web]
port = 8443
host = "0.0.0.0"
# Optional additional plain-HTTP listener (no TLS cert warning in browsers).
# 0 = disabled. Session cookies issued over this port omit the `Secure` flag.
http_port = 8088
# Hostname/IP advertised in stream URLs returned to clients (RTSP/ONVIF/Snapshot).
# Empty = auto-detect LAN IP at startup via UDP probe.
# Set this explicitly when behind NAT or if auto-detection picks the wrong interface.
advertised_host = ""

[rtsp]
server_port = 8554


[capture]
video_device = "/dev/video0"
audio_device = "default"

[security]
rate_limit_max = 20
rate_limit_window_secs = 60

[observability]
# OTLP trace exporter endpoint (gRPC). Empty by default — set to your
# collector's address (e.g. "http://localhost:4317") to enable tracing.
# Leaving this empty avoids the BatchSpanProcessor busy-looping when no
# collector is reachable (default-OFF per the project's outbound policy).
otel_endpoint = ""
log_level = "info"

# ---------------------------------------------------------------------------
# Remote log shipping (Loki-compatible HTTP endpoint)
# Uncomment the lines below to enable shipping structured logs to a remote
# Loki-compatible backend (e.g. Grafana Loki, VictoriaMetrics/vm-logs).
#
# This is an OPTIONAL feature — the app works fine without it. When enabled,
# logs are shipped in addition to stdout/stderr. Network errors are logged as
# warnings and do not crash the application (fail-open).
# ---------------------------------------------------------------------------
# [observability.logs]
# endpoint = "http://loki:3100"
# batch_size = 100
# flush_interval_secs = 5
# labels = { service = "mibee-rec" }
[onvif]
enabled = false
device_name = "mibee-rec"
manufacturer = "MiBee"
model = "Rec-01"
serial = "NC00000001"
firmware_version = "1.0.0"

[gb28181]
enabled = false
platform_sip_address = "192.168.1.100"
platform_sip_port = 5060
device_id = "34020000002000000001"
username = ""
password = ""
sip_domain = "3402000000"
register_interval_secs = 60
heartbeat_interval_secs = 60
heartbeat_timeout_count = 3
channel_id = "34020000001320000001"
local_sip_port = 5060

[rtmp_push]
enabled = false
push_url = "rtmp://192.168.1.100:1935/live"
app_name = "live"
stream_name = "stream1"
reconnect_interval_secs = 5
max_reconnect_attempts = 10

[recording]
# Master enable toggle. When true, all streams auto-record to MP4 segments.
# Individual recording parameters (path, segment duration, capacity) below.
enabled = false
# Directory where MP4 segment files are written. Must exist and be writable.
path = "./recordings"
# MP4 segment duration in seconds (each file covers this much video).
segment_duration_secs = 900
# Max total capacity in megabytes. 0 = unlimited (no auto-pruning).
# When exceeded, oldest segments are deleted first (FIFO).
max_capacity_mb = 10240

[ai]
# On-device AI object detection (NanoDet-Plus 320, COCO 80 classes) — the
# same model and semantics as the raspi cameras (SPEC v1 §4.6).
# Off by default, like the outbound protocols. When enabled:
#   - the model is loaded once at startup (fail-open: a missing model or
#     libonnxruntime.so just leaves AI disabled, logged in the startup log);
#   - each started camera stream gets a detection worker that taps the JPEG
#     preview (never the capture/encode path);
#   - results appear in the web UI overlay, GET /api/detections and
#     ai_detection SSE events.
# libonnxruntime.so is located via the ORT_DYLIB_PATH environment variable
# or the system library path.
enabled = false
model_path = "models/nanodet-m.onnx"
confidence_threshold = 0.5
interval_ms = 1000
